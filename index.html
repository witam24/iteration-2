<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 迭代 (2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: the same exam-paper workbench as "Python 迭代 (1)", now with a felt card table:
   the list is a row of numbered cards, the loop variable is a pointer above them, and running values are cards on the side. */
:root {
  --paper: #EDF0EC;
  --sheet: #FFFFFF;
  --sheet-2: #F6F8F5;
  --ink: #17202A;
  --muted: #56626D;
  --rule: #D2D9D3;
  --rule-strong: #A9B4AC;
  --pen: #1C4C9C;
  --pen-soft: #E1E9F6;
  --red: #BF321E;
  --red-soft: #FAE4E0;
  --green: #1B7142;
  --green-soft: #DDEFE3;
  --amber: #9A5A00;
  --amber-soft: #FAEED6;
  --kw: #78308C;
  --hl: #FFE14F;
  --hl-line: #FFF2A1;
  --felt: #DCE7DF;
  --felt-edge: #BFD0C4;
  --card: #FFFEFB;
  --card-edge: #8C9A90;
  --shadow: 0 1px 0 rgba(23, 32, 42, .06), 0 2px 8px rgba(23, 32, 42, .05);
  --card-shadow: 0 1px 0 rgba(23, 32, 42, .10), 0 3px 6px rgba(23, 32, 42, .10);
  --f-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", "Noto Sans TC", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151A; --sheet: #1A2027; --sheet-2: #151A20; --ink: #E3E8EC; --muted: #95A1AC;
    --rule: #2A323B; --rule-strong: #3D4752; --pen: #8EB3F4; --pen-soft: #1B2940; --red: #FF8E79; --red-soft: #3A1E19;
    --green: #70D39A; --green-soft: #14301F; --amber: #F0B152; --amber-soft: #35280E; --kw: #D59CE6;
    --hl: #E5C43A; --hl-line: #3B3511; --felt: #18241D; --felt-edge: #26372C; --card: #232A31; --card-edge: #55626D;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); --card-shadow: 0 2px 6px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151A; --sheet: #1A2027; --sheet-2: #151A20; --ink: #E3E8EC; --muted: #95A1AC;
  --rule: #2A323B; --rule-strong: #3D4752; --pen: #8EB3F4; --pen-soft: #1B2940; --red: #FF8E79; --red-soft: #3A1E19;
  --green: #70D39A; --green-soft: #14301F; --amber: #F0B152; --amber-soft: #35280E; --kw: #D59CE6;
  --hl: #E5C43A; --hl-line: #3B3511; --felt: #18241D; --felt-edge: #26372C; --card: #232A31; --card-edge: #55626D;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); --card-shadow: 0 2px 6px rgba(0, 0, 0, .45); color-scheme: dark;
}
html { font-size: 16px; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
code, pre, .mono { font-family: var(--f-code); }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Header ---------- */
.top { padding-block: 18px 0; }
.top-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; color: var(--muted); margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; line-height: 1.2; margin: 2px 0 0; text-wrap: balance; }
h1 .py { color: var(--pen); }
.top-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lang-link { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 4px 12px; cursor: pointer; font-weight: 500; }
.lang-link:hover { border-color: var(--pen); color: var(--pen); }
.size-ctl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.size-ctl button { width: 2.2rem; height: 2rem; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); cursor: pointer; font-weight: 700; }
.size-ctl button:hover { border-color: var(--pen); color: var(--pen); }
.tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 2px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; background: none; border: 0; padding: 10px 16px 9px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs button .n { font-family: var(--f-code); font-size: .8em; margin-right: 6px; color: var(--rule-strong); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen); }
.tabs button[aria-selected="true"] .n { color: var(--pen); }
.tabs button:hover { color: var(--ink); }
main { padding-block: 20px 48px; }
section.tab { display: grid; gap: 16px; }

/* ---------- Generic pieces ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.sheet-head h3 { margin: 0; font-size: .82rem; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.sheet-body { padding: 14px; min-width: 0; }
h2.sec { font-family: var(--f-display); font-size: 1.45rem; margin: 0; font-weight: 700; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; line-height: 1.3; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--pen); color: var(--pen); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--sheet); }
.btn.small { padding: 3px 9px; font-size: .85rem; }
.btn.good { border-color: var(--green); color: var(--green); }
.btn.bad { border-color: var(--red); color: var(--red); }
.t-true { color: var(--green); font-weight: 600; }
.t-false { color: var(--red); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cols-main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .two, .cols-main { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--pen); color: var(--sheet); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: inline-flex; align-items: center; gap: 6px; }
.field input { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 5px 8px; min-width: 0; }
.field input.wide { width: 16rem; max-width: 100%; }
.field input.num { width: 5.5rem; }
.field label { font-size: .88rem; color: var(--muted); }
.msg { font-size: .88rem; min-height: 1.4em; margin: 6px 0 0; }
.msg.err { color: var(--red); }
.msg.ok { color: var(--green); }
.note { background: var(--amber-soft); border-radius: var(--r); padding: 10px 14px; color: var(--ink); }
.note b { color: var(--amber); }

/* code highlight */
.k { color: var(--kw); font-weight: 600; }
.b { color: var(--pen); }
.s { color: var(--green); }
.nu { color: var(--amber); }
.cm { color: var(--muted); font-style: italic; }

/* ---------- Code sheet ---------- */
.code { margin: 0; font-family: var(--f-code); font-size: .92rem; line-height: 1.75; overflow-x: auto; background: var(--sheet); }
.code .ln { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); white-space: pre; border-left: 4px solid transparent; }
.code .ln .no { color: var(--rule-strong); text-align: right; padding-right: .9em; user-select: none; }
.code .ln.on { background: var(--hl-line); border-left-color: var(--hl); }
.code .ln.on .no { color: var(--ink); font-weight: 600; }
pre.static { margin: 0; padding: 10px 12px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: var(--r); font-size: .88rem; line-height: 1.6; overflow-x: auto; white-space: pre; }

/* ---------- Card table ---------- */
.table-felt { background: var(--felt); border: 1px solid var(--felt-edge); border-radius: 10px; padding: 14px 14px 10px; overflow-x: auto; }
.felt-label { font-family: var(--f-code); font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.felt-label b { color: var(--ink); }
.cards { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 28px; min-height: 140px; align-items: flex-start; }
.slot { display: grid; justify-items: center; gap: 4px; position: relative; }
.card { width: 62px; height: 86px; border-radius: 9px; background: var(--card); border: 1.5px solid var(--card-edge); box-shadow: var(--card-shadow);
  display: grid; place-items: center; position: relative; font-family: var(--f-code); font-weight: 600; font-size: 1.35rem; color: var(--ink);
  font-variant-numeric: tabular-nums; transition: transform .25s ease, background .25s ease, border-color .25s ease, opacity .25s ease; }
.card::before, .card::after { content: attr(data-v); position: absolute; font-size: .62rem; font-weight: 500; color: var(--muted); }
.card::before { top: 4px; left: 6px; }
.card::after { bottom: 4px; right: 6px; transform: rotate(180deg); }
.card.cur { background: var(--hl-line); border-color: var(--amber); transform: translateY(-8px); }
.card.done { opacity: .55; }
.card.hit { background: var(--green-soft); border-color: var(--green); }
.card.bad { background: var(--red-soft); border-color: var(--red); }
.card.changed { background: var(--pen-soft); border-color: var(--pen); }
.card.pick { cursor: pointer; }
.card.pick:hover { border-color: var(--pen); }
.card.sel { outline: 3px solid var(--pen); outline-offset: 2px; }
.card.enter { animation: enter .35s ease; }
@keyframes enter { from { transform: translateY(-18px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.idx { font-family: var(--f-code); font-size: .75rem; color: var(--muted); }
.ptr { position: absolute; top: -27px; left: 50%; transform: translateX(-50%); font-family: var(--f-code); font-size: .78rem; font-weight: 600; color: var(--sheet);
  background: var(--pen); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.ptr::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: var(--pen); }
.ptr.two { background: var(--amber); }
.ptr.two::after { border-top-color: var(--amber); }
.empty-hand { color: var(--muted); font-size: .9rem; align-self: center; padding: 20px 4px; }

/* variables as cards / chips */
.vars { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 10px; }
.vbox { display: grid; justify-items: center; gap: 3px; }
.vbox .vname { font-family: var(--f-code); font-size: .8rem; color: var(--muted); }
.vcard { min-width: 62px; height: 62px; padding: 0 8px; border-radius: 9px; border: 1.5px dashed var(--card-edge); background: var(--sheet); display: grid; place-items: center;
  font-family: var(--f-code); font-weight: 600; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.vchip { font-family: var(--f-code); font-size: .9rem; background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 8px; }
.vbox.chg .vcard, .vbox.chg .vchip { border-color: var(--amber); background: var(--amber-soft); animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.12); } }

/* stepper readouts */
.stepbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.counter { font-family: var(--f-code); font-size: .85rem; color: var(--muted); }
.narr { margin: 10px 0 0; padding: 10px 14px; border-left: 4px solid var(--pen); background: var(--pen-soft); border-radius: 0 var(--r) var(--r) 0; min-height: 3.2em; }
.console { font-family: var(--f-code); background: #10161C; color: #E6EDF2; border-radius: var(--r); padding: 10px 12px; min-height: 4.5em; white-space: pre-wrap; font-size: .9rem; line-height: 1.55; overflow-x: auto; }
.console .dim { color: #8A97A3; }
.trace { width: 100%; border-collapse: collapse; font-family: var(--f-code); font-size: .88rem; font-variant-numeric: tabular-nums; }
.trace th, .trace td { border: 1px solid var(--rule); padding: 4px 8px; text-align: center; }
.trace th { background: var(--sheet-2); font-weight: 600; }
.trace tr.new td { background: var(--hl-line); }
.trace td.first { color: var(--muted); }
.tscroll { overflow-x: auto; }
.tnote { font-size: .82rem; color: var(--muted); margin: 0 0 6px; }

/* app picker */
.apps { display: flex; flex-wrap: wrap; gap: 6px; }
.apps button { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .92rem; }
.apps button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.scenario { background: var(--sheet-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 14px; }
.scenario .tag { font-size: .75rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.scenario p { margin: 2px 0 0; }
details.think { margin-top: 10px; border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 12px; background: var(--sheet); }
details.think summary { cursor: pointer; font-weight: 600; }
details.think p { margin: 6px 0 0; }

/* objectives */
.objs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.objs li { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; }
.objs .where { display: block; font-size: .78rem; color: var(--pen); font-weight: 600; margin-top: 4px; }
.facts { width: 100%; border-collapse: collapse; font-size: .92rem; }
.facts th, .facts td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.facts th { background: var(--sheet-2); }
.facts code { font-size: .88rem; }
.log { font-family: var(--f-code); font-size: .88rem; display: grid; gap: 4px; max-height: 15em; overflow-y: auto; }
.log div { padding: 3px 8px; border-radius: 4px; background: var(--sheet-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.log div.err { background: var(--red-soft); color: var(--red); }
.log .res { color: var(--green); }

/* game */
.game-q { font-size: 1.05rem; margin: 12px 0 8px; }
.score { font-family: var(--f-code); color: var(--muted); }
.fb { margin-top: 8px; min-height: 1.6em; font-weight: 500; }
.fb.ok { color: var(--green); }
.fb.no { color: var(--red); }

/* compare */
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 3em; gap: 8px; align-items: center; font-size: .88rem; }
.bar { height: 14px; border-radius: 3px; background: var(--pen); min-width: 2px; }
.bar.alt { background: var(--rule-strong); }
.cmp-grid { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.cmp-grid th, .cmp-grid td { border: 1px solid var(--rule); padding: 5px 8px; text-align: center; }
.cmp-grid th { background: var(--sheet-2); }
.cmp-grid tr.sel td { background: var(--hl-line); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); display: inline-block; }
.dots i.on { background: var(--pen); }
.dots i.hit { background: var(--green); }

/* mistakes */
.mist { display: grid; gap: 12px; }
.mcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.mcard h3 { margin: 0; font-size: 1rem; }
.mcard .q { margin: 0; }
.mcard .ans { border-top: 1px dashed var(--rule-strong); padding-top: 8px; display: grid; gap: 6px; }
.mcard .tag { font-family: var(--f-code); font-size: .75rem; color: var(--red); }
/* tab 1: i versus scores[i] */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--f-code); font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; border-radius: 3px; }
.legend .lg-card { background: var(--card); border: 1.5px solid var(--card-edge); }
.legend .lg-chip { background: var(--pen); }
.ivcards .slot { gap: 8px; }
.ichip { width: 62px; height: 34px; border-radius: 6px; border: 1.5px solid var(--pen); background: var(--sheet); color: var(--pen); font-family: var(--f-code); font-weight: 600; font-size: 1rem; cursor: pointer; }
.ichip.on { background: var(--pen); color: var(--sheet); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.ival { font-family: var(--f-code); font-weight: 600; font-size: 1.1rem; min-width: 4.5em; text-align: center; color: var(--pen); }
.facts.expr tr.ri td:first-child code { color: var(--pen); font-weight: 600; }
.facts.expr tr.ri td, .facts.expr tr.rv td { background: var(--sheet-2); }
.facts td.res { font-weight: 600; white-space: nowrap; }
.trace.fill th[scope], .trace.fill tbody th { background: var(--sheet-2); font-weight: 500; color: var(--muted); white-space: nowrap; }
.trace.fill tr.given td { color: var(--muted); background: var(--sheet-2); }
.trace.fill tr.focus th { color: var(--pen); }
.trace.fill td { padding: 3px; min-width: 4.5em; }
.cell-in { width: 100%; min-width: 4em; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); padding: 4px 6px; text-align: center; font-family: var(--f-code); }
.trace.fill td.ok .cell-in { border-color: var(--green); background: var(--green-soft); }
.trace.fill td.no .cell-in { border-color: var(--red); background: var(--red-soft); }
.trace.fill td.shown .cell-in { color: var(--pen); }
.ivcards span.ichip { display: grid; place-items: center; cursor: default; }
.code.blanks { padding-block: 6px; }
.code.blanks .ln { white-space: pre; align-items: center; }
.blank { font-family: var(--f-code); font-size: .9rem; border: 1.5px dashed var(--pen); border-radius: 4px; background: var(--pen-soft); color: var(--ink); padding: 1px 4px; min-width: 3ch; }
.blank.ok { border-style: solid; border-color: var(--green); background: var(--green-soft); }
.blank.no { border-style: solid; border-color: var(--red); background: var(--red-soft); }
.blank.shown { color: var(--pen); }
.guide ol { margin: 4px 0 0; padding-left: 1.6em; display: grid; gap: 4px; }
.guide li::marker { font-family: var(--f-code); color: var(--pen); font-weight: 600; }
.blank::placeholder { color: var(--pen); opacity: .7; text-align: center; }
pre.cell { margin: 0; font-size: .85rem; line-height: 1.55; white-space: pre; }
@media (max-width: 520px) { .ichip { width: 52px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 520px) { h1 { font-size: 1.7rem; } .card { width: 52px; height: 74px; font-size: 1.15rem; } .cards { gap: 7px; } }

/* ===== Light refresh: soft blue-grey paper, white sheets, rounded panels, left example menu ===== */
:root {
  --paper: #F4F6FA; --sheet: #FFFFFF; --sheet-2: #F7F9FC; --ink: #1E293B; --muted: #5F6B7E; --rule: #E2E7EF; --rule-strong: #C3CCDA;
  --pen: #2F5BD3; --pen-soft: #E8EEFC; --green: #18794E; --green-soft: #E3F4EA; --red: #C2412D; --red-soft: #FCE9E5; --amber: #A15C07; --amber-soft: #FDF1DC;
  --hl: #F5C542; --hl-line: #FFF7D6; --felt: #F0F4FA; --felt-edge: #DCE3EE; --card: #FFFFFF; --card-edge: #B8C3D6; --r: 10px;
  --shadow: 0 1px 2px rgba(30,41,59,.05), 0 4px 14px rgba(30,41,59,.06); --card-shadow: 0 1px 2px rgba(30,41,59,.08), 0 3px 8px rgba(47,91,211,.10);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121722; --sheet: #1A2130; --sheet-2: #161C29; --ink: #E6EAF1; --muted: #9AA5B8; --rule: #283245; --rule-strong: #3B475E; --pen: #8CAEFF; --pen-soft: #1E2A45;

/* wrong-answer explosion */
.boom { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; place-items: center; animation: boomFlash 1.4s ease-out forwards; }
.boom canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.boom-ring { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 10px solid #FF7A1A; animation: boomRing .9s ease-out forwards; }
.boom-ring.r2 { border-color: #FFD23F; animation-delay: .12s; opacity: 0; }
.boom-word { position: relative; font-family: var(--f-display); font-weight: 700; font-size: clamp(2.4rem, 9vw, 6rem); color: #FFF3B0; -webkit-text-stroke: 2px #B3220F; text-shadow: 0 4px 0 #B3220F, 0 0 30px #FF7A1A; animation: boomWord 1.4s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes boomFlash { 0% { background: rgba(255, 245, 200, .95); } 12% { background: rgba(255, 120, 40, .55); } 60% { background: rgba(60, 20, 10, .25); } 100% { background: rgba(0, 0, 0, 0); } }
@keyframes boomRing { from { transform: scale(.2); opacity: 1; } to { transform: scale(40); opacity: 0; } }
@keyframes boomWord { 0% { transform: scale(.2) rotate(-8deg); opacity: 0; } 25% { transform: scale(1.15) rotate(3deg); opacity: 1; } 75% { transform: scale(1) rotate(0); opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
.boom.calm { animation: boomCalm .7s ease-out forwards; }
.boom.calm .boom-ring { display: none; }
.boom.calm .boom-word { animation: none; opacity: .9; }
@keyframes boomCalm { from { background: rgba(255, 120, 40, .35); } to { background: rgba(0, 0, 0, 0); } }
#app.shake { animation: shake .55s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 10%, 90% { transform: translate(-3px, 2px); } 20%, 80% { transform: translate(6px, -4px); } 30%, 50%, 70% { transform: translate(-12px, 6px) rotate(-.6deg); } 40%, 60% { transform: translate(12px, -6px) rotate(.6deg); } }
/* ten-stage gauntlet */

/* step-by-step tracer */
.p6trace:focus { outline: none; }

.tr-table { width: 100%; font-family: var(--f-code); font-size: .85rem; }
.tr-table th { position: sticky; top: 0; background: var(--sheet-2); z-index: 1; }
.tr-table td { white-space: nowrap; }

.tr-body { grid-template-columns: minmax(0, 1fr); }
.tr-body > *, .tr-grid > * { min-width: 0; }
.tr-code { min-width: 100%; width: max-content; }
.tr-code .ln { grid-template-columns: 1.2em 2.4em max-content minmax(3.5em, 1fr); }
.tr-cnt { text-align: right; }

/* ===== Lab-bench theme (from 程式測試及除錯.html v4): sage paper, teal accent, serif headings, dark code panels ===== */
:root {
  --paper: #EEF2EF; --sheet: #FFFFFF; --sheet-2: #E3E9E5; --ink: #18212B; --muted: #56616B; --rule: #CDD6D1; --rule-strong: #A9B6AF;
  --pen: #0E6B66; --pen-soft: #D5ECE9; --green: #2F7D3A; --green-soft: #DDF0DF; --red: #B42318; --red-soft: #FBE3E0; --amber: #9A5B00; --amber-soft: #FBEED6;
  --kw: #7A4FD0; --hl: #E8D44D; --hl-line: #FBEED6; --felt: #E3E9E5; --felt-edge: #CDD6D1; --card: #FFFFFF; --card-edge: #A9B6AF; --r: 8px;
  --shadow: none; --card-shadow: 0 1px 0 rgba(24,33,43,.08), 0 2px 6px rgba(24,33,43,.08);
  --code-bg: #1C232D; --code-fg: #E6EDF3; --code-dim: #7D8A99; --code-hl: #2D3A4A; --code-kw: #F0A86B; --code-str: #9ED69B; --code-num: #8FC7FF; --code-com: #7D8A99; --code-cur: #3B4A2A;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11171C; --sheet: #182129; --sheet-2: #0D1317; --ink: #E5ECEA; --muted: #9AA8AE; --rule: #2B3842; --rule-strong: #3E4E59;
  --pen: #5CC4BB; --pen-soft: #163A38; --green: #6FD07D; --green-soft: #173523; --red: #FF8A7E; --red-soft: #3E1C19; --amber: #F2B75E; --amber-soft: #3A2A10;

* { font-variant-ligatures: none; }
body { line-height: 1.7; }
:focus-visible { outline: 3px solid var(--pen); }
:not(pre) > code { background: var(--sheet-2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
a { color: var(--pen); }

/* header + numbered sticky tabs */
.top { background: var(--paper); border-bottom: 0; padding-block: 28px 0; }
.eyebrow { font-size: .8rem; letter-spacing: .12em; color: var(--pen); font-weight: 700; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.8rem, 4.5vw, 2.6rem); line-height: 1.3; }
h1 .py { color: var(--pen); }
.lang-link, .size-ctl button { border-color: var(--rule); background: var(--sheet); border-radius: 8px; }
.tabs { margin-top: 14px; gap: 2px; border-bottom: 2px solid var(--rule); background: var(--paper); }
.tabs button { border-radius: 0; padding: 10px 14px 9px; font-size: 1rem; }
.tabs button[aria-selected="true"] { background: none; border-bottom-color: var(--pen); }
.tabs button .n { color: var(--rule-strong); }
main { padding-block: 24px 64px; }
section.tab { gap: 20px; }
h2.sec { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.4rem, 3vw, 1.8rem); line-height: 1.3; }
.p6title, .p6warn { font-family: var(--f-display); font-weight: 700; }
.lead { color: var(--muted); }

/* lab-bench cards */
.sheet { border-radius: 12px; border: 1px solid var(--rule); box-shadow: none; }
.sheet-head { background: none; border-bottom: 1px solid var(--rule); padding: 12px 20px 10px; border-radius: 12px 12px 0 0; }
.sheet-head h3 { font-family: var(--f-code); font-size: .75rem; letter-spacing: .1em; font-weight: 600; color: var(--pen); }
.sheet-body { padding: 18px 20px; }
.side { border-radius: 12px; box-shadow: none; padding: 6px; }
.side-h { font-family: var(--f-code); color: var(--pen); }
.side button { border-left: 0; border-radius: 8px; }
.side button[aria-pressed="true"] { background: var(--pen-soft); color: var(--ink); border-left: 0; }
@media (max-width: 760px) { .side button { border: 1px solid var(--rule); } .side button[aria-pressed="true"] { border-color: var(--pen); } }

/* buttons */
.btn { border-color: var(--rule); border-radius: 8px; padding: 7px 14px; font-size: .875rem; }
.btn.small { padding: 3px 10px; font-size: .82rem; }

details.think { border-color: var(--rule); border-radius: 8px; background: var(--paper); }
.objs li { border-radius: 12px; }
.objs .where { color: var(--pen); font-family: var(--f-code); }
.mcard { border-radius: 12px; }

/* tables: horizontal rules only */
.facts, .trace, .cmp-grid { font-size: .9rem; }
.facts th, .facts td, .trace th, .trace td, .cmp-grid th, .cmp-grid td { border: 0; border-bottom: 1px solid var(--rule); padding: 7px 10px; }

.tr-twrap { border-color: var(--rule); }
.p6t { border-color: var(--rule); background: var(--paper); }

.code, pre.static, .console { background: var(--code-bg); color: var(--code-fg); border-radius: 10px; font-family: var(--f-code); font-size: .875rem; line-height: 1.65; }
.code { padding-block: 12px; border: 0; }

.code .b, pre.static .b { color: var(--code-num); }
.code .s, pre.static .s { color: var(--code-str); }
.code .nu, pre.static .nu { color: var(--code-num); }
.code .cm, pre.static .cm { color: var(--code-com); }

.code.blanks .blank.ok { background: rgba(111, 208, 125, .22); border-color: #6FD07D; }
.code.blanks .blank.no { background: rgba(255, 138, 126, .22); border-color: #FF8A7E; }
.code.blanks .blank.shown { color: #8FD3CC; }
.tr-code { border: 0; }
.tr-code .ln.err { background: rgba(255, 138, 126, .2); border-left-color: #FF8A7E; }
.tr-arrow { color: var(--hl); }
.tr-cnt { color: var(--code-dim); }
.p6cmp .console .dl { background: rgba(255, 120, 100, .32); }

.dots i.on, .bar, .gt-bar i { background: var(--pen); }
.gt-stage { color: var(--pen); font-family: var(--f-code); }
.p6dlg { border-radius: 12px; }

/* ---- Python engine (Pyodide in a Web Worker, so an infinite loop can be stopped) ---- */
const PY = { w: null, state: 'idle', seq: 0, wait: {}, listen: {} };
function pyStatus(s) { PY.state = s; Object.values(PY.listen).forEach(f => f(s)); }
function pyStart() {
  if (PY.w) return;
  try { PY.w = new Worker('worker.js'); } catch (e) { pyStatus('failed'); return; }
  pyStatus('loading');
  PY.w.onmessage = e => { const cb = PY.wait[e.data.id]; if (cb) { delete PY.wait[e.data.id]; cb(e.data); } };
  PY.w.onerror = () => { pyStatus('failed'); Object.values(PY.wait).forEach(cb => cb({ fail: 'worker' })); PY.wait = {}; };

function p6Code(q) {

}
function p6Explain(r, L) {
  if (r.kind === 'syntax') return L.syntax(r.line, r.err);
  if (r.kind === 'error') return L.error(r.line, r.err);
  if (r.kind === 'noinput') return L.noinput;
  if (r.kind === 'timeout') return L.timeout;

}
function p6Diff(exp, got, L) {

}

function p5Code(q) {

function p5Explain(r, L) {

function p5Diff(exp, got, L) {

}

    startEmpty: true, def: () => [72, 45, 88, 60], min: 1, max: 8, rnd: () => Array.from({ length: rnd(3, 5) }, () => rnd(35, 98)),
    code: p => [`n = int(input("${p.p_n}"))`, 'marks = []', 'for k in range(n):', `    m = int(input("${p.p_mark}"))`, '    marks = marks + [m]', 'for i in range(len(marks)):', '    print(marks[i], end=" ")', 'print()'],
    cols: () => ['k', 'm', 'marks'],
    run(d, R) {
      const { st } = R; st.cards = [];
      R.pr(P().p_n + d.length); R.set('n', d.length); R.push(1, N.input(d.length));
      R.set('marks', '[]'); st.trace.push(['—', '—', '[]']); R.push(2, N.emptyList);
      const cur = [];
      d.forEach((v, k) => {
        R.set('k', k); R.push(3, k === 0 ? N.rangeN(d.length) : `k = ${k}`);
        R.pr(P().p_mark + v); R.set('m', v); R.push(4, N.input(v));
        cur.push(v); st.cards = cur.slice(); st.cls = {}; st.cls[k] = 'enter changed'; R.set('marks', rep(cur)); st.trace.push([k, v, rep(cur)]); R.push(5, N.add(v, cur.length));
        st.cls = {};
      });
      R.push(3, N.endIdx(d.length));
      d.forEach((v, k) => {
        st.cls = {}; st.cls[k] = 'cur'; st.ptr = at(k); R.set('i', k); R.push(6, N.takeIdx('marks', k, v));
        R.pr(String(v), ' '); R.push(7, N.printEnd(k, v));
      });
      st.cls = {}; st.ptr = null; R.push(6, N.endIdx(d.length));
      R.pr(''); R.push(8, N.newline);
    },
  },
  sum: {
    def: () => [72, 45, 88, 60, 91], min: 2, max: 10, rnd: () => Array.from({ length: rnd(4, 6) }, () => rnd(30, 99)),
    code: (p, d) => [`marks = ${rep(d)}`, 'total = 0', 'for i in range(len(marks)):', '    total = total + marks[i]', `print("${p.p_sum}", total)`],
    cols: () => ['i', 'marks[i]', 'total'],
    run(d, R) {
      const { st } = R; R.push(1, N.list('marks', d.length));
      R.set('total', 0, 'card'); st.trace.push(['—', '—', 0]); R.push(2, N.init('total', 0, N.accZero));
      let total = 0;
      d.forEach((v, k) => {
        st.cls[k] = 'cur'; st.ptr = at(k); R.set('i', k); R.push(3, N.takeIdx('marks', k, v));
        const o = total; total += v; R.set('total', total, 'card'); st.trace.push([k, v, total]); R.push(4, N.accI('total', 'marks', k, o, v, total));
        st.cls[k] = 'done';
      });
      st.ptr = null; R.push(3, N.endIdx(d.length));
      R.pr(`${P().p_sum} ${total}`); R.push(5, N.print);
    },
  },
  avg: {
    def: () => [68, 75, 52, 90, 81, 60], min: 2, max: 10, rnd: () => Array.from({ length: rnd(4, 6) }, () => rnd(30, 99)),
    code: (p, d) => [`marks = ${rep(d)}`, 'total = 0', 'for i in range(len(marks)):', '    total = total + marks[i]', 'average = total / len(marks)', `print("${p.p_avg}", average)`],
    cols: () => ['i', 'marks[i]', 'total'],
    run(d, R) {
      const { st } = R; R.push(1, N.list('marks', d.length));
      R.set('total', 0, 'card'); st.trace.push(['—', '—', 0]); R.push(2, N.init('total', 0, N.accZero));
      let total = 0;
      d.forEach((v, k) => {
        st.cls[k] = 'cur'; st.ptr = at(k); R.set('i', k); R.push(3, N.takeIdx('marks', k, v));
        const o = total; total += v; R.set('total', total, 'card'); st.trace.push([k, v, total]); R.push(4, N.accI('total', 'marks', k, o, v, total));
        st.cls[k] = 'done';
      });
      st.ptr = null; R.push(3, N.endIdx(d.length));
      const a = total / d.length; R.set('average', rep({ f: a }), 'card'); R.push(5, N.avg(total, d.length, rep({ f: a })));
      R.pr(`${P().p_avg} ${rep({ f: a })}`); R.push(6, N.print);
    },
  },
  max: {
    def: () => [21, 26, 18, 29, 24, 16, 22], min: 2, max: 10, rnd: () => Array.from({ length: rnd(5, 7) }, () => rnd(-4, 34)),
    code: (p, d) => [`temps = ${rep(d)}`, 'largest = temps[0]', 'for i in range(len(temps)):', '    if temps[i] > largest:', '        largest = temps[i]', `print("${p.p_hi}", largest)`],
    cols: () => ['i', 'temps[i]', 'temps[i] > largest', 'largest'],
    run(d, R) { extreme(d, R, '>', 'largest', 'p_hi'); },
  },
  min: {
    def: () => [21, 26, 18, 29, 24, 16, 22], min: 2, max: 10, rnd: () => Array.from({ length: rnd(5, 7) }, () => rnd(-4, 34)),
    code: (p, d) => [`temps = ${rep(d)}`, 'smallest = temps[0]', 'for i in range(len(temps)):', '    if temps[i] < smallest:', '        smallest = temps[i]', `print("${p.p_lo}", smallest)`],
    cols: () => ['i', 'temps[i]', 'temps[i] < smallest', 'smallest'],
    run(d, R) { extreme(d, R, '<', 'smallest', 'p_lo'); },
  },
  countif: {
    def: () => [72, 45, 88, 30, 91, 50], min: 2, max: 10, rnd: () => Array.from({ length: rnd(5, 7) }, () => rnd(20, 99)),
    code: (p, d) => [`marks = ${rep(d)}`, 'count = 0', 'pass_total = 0', 'for i in range(len(marks)):', '    if marks[i] >= 50:', '        count = count + 1', '        pass_total = pass_total + marks[i]', `print("${p.p_pass}", count)`, `print("${p.p_passTotal}", pass_total)`],
    cols: () => ['i', 'marks[i]', 'marks[i] >= 50', 'count', 'pass_total'],
    run(d, R) {
      const { st } = R; R.push(1, N.list('marks', d.length));
      let c = 0, s = 0;
      R.set('count', 0, 'card'); R.push(2, N.init('count', 0, ''));
      R.set('pass_total', 0, 'card'); st.trace.push(['—', '—', '—', 0, 0]); R.push(3, N.init('pass_total', 0, N.accZero));
      d.forEach((v, k) => {
        st.cls[k] = 'cur'; st.ptr = at(k); R.set('i', k); R.push(4, N.takeIdx('marks', k, v));
        const ok = v >= 50; R.push(5, N.ifres(`marks[${k}] >= 50  (${v} >= 50)`, ok ? 'True' : 'False'));
        if (ok) {
          c += 1; R.set('count', c, 'card'); R.push(6, N.acc('count', c - 1, 1, c));
          const o = s; s += v; R.set('pass_total', s, 'card'); st.trace.push([k, v, 'True', c, s]); R.push(7, N.accI('pass_total', 'marks', k, o, v, s));
          st.cls[k] = 'hit';
        } else { st.trace.push([k, v, 'False', c, s]); R.fixTrace(); st.cls[k] = 'bad'; }
      });
      st.ptr = null; R.push(4, N.endIdx(d.length));
      R.pr(`${P().p_pass} ${c}`); R.push(8, N.print);
      R.pr(`${P().p_passTotal} ${s}`); R.push(9, N.print);
    },
  },
  search: {
    def: () => [305, 112, 478, 220, 391, 150], min: 2, max: 10, cmp: true, target: 220,
    rnd: () => { const s = new Set(); while (s.size < 6) s.add(rnd(100, 499)); return [...s]; },
    code: (p, d) => [`codes = ${rep(d)}`, `target = int(input("${p.p_in_target}"))`, 'position = -1', 'for i in range(len(codes)):', '    if codes[i] == target:', '        position = i', '        break', 'if position == -1:', `    print("${p.p_nf}")`, 'else:', `    print("${p.p_pos}", position)`],
    cols: () => ['i', 'codes[i]', 'codes[i] == target', 'position'],
    run(d, R, opt) {
      const { st } = R; const tg = opt.target; R.push(1, N.list('codes', d.length));
      R.pr(P().p_in_target + tg); R.set('target', tg); R.push(2, N.input(tg));
      let pos = -1; R.set('position', -1, 'card'); st.trace.push(['—', '—', '—', -1]); R.push(3, N.init('position', -1, ''));
      for (let k = 0; k < d.length; k++) {
        st.cls[k] = 'cur'; st.ptr = at(k); R.set('i', k); R.push(4, N.takeIdx('codes', k, d[k]));
        const eq = d[k] === tg; st.cmp += 1;
        st.trace.push([k, d[k], eq ? 'True' : 'False', eq ? k : pos]);
        if (eq) {
          R.push(5, N.cmp(`codes[${k}] == target  (${d[k]} == ${tg})`, 'True'));
          pos = k; st.cls[k] = 'hit'; R.set('position', k, 'card'); R.push(6, N.found(k));
          st.ptr = null; R.push(7, N.brk); break;
        }
        R.push(5, N.cmp(`codes[${k}] == target  (${d[k]} == ${tg})`, 'False'));
        st.cls[k] = 'done';
      }
      if (pos === -1) { st.ptr = null; R.push(4, N.endIdx(d.length)); }
      R.push(8, N.ifres(`${pos} == -1`, pos === -1 ? 'True' : 'False'));
      if (pos === -1) { R.pr(P().p_nf); R.push(9, N.nf); }
      else { R.push(10, ''); R.pr(`${P().p_pos} ${pos}`); R.push(11, N.print); }
    },
  },
  sorted: {
    def: () => [148, 152, 152, 160, 158, 165], min: 2, max: 10, cmp: true,
    rnd: () => { const a = Array.from({ length: rnd(5, 7) }, () => rnd(140, 175)).sort((x, y) => x - y); if (Math.random() < .6) { const i = rnd(0, a.length - 2); if (a[i] !== a[i + 1]) [a[i], a[i + 1]] = [a[i + 1], a[i]]; } return a; },
    code: (p, d) => [`heights = ${rep(d)}`, 'is_sorted = True', 'for i in range(len(heights) - 1):', '    if heights[i] > heights[i + 1]:', '        is_sorted = False', '        break', 'if is_sorted:', `    print("${p.p_sorted}")`, 'else:', `    print("${p.p_unsorted}", i)`],
    cols: () => ['i', 'heights[i]', 'heights[i + 1]', 'heights[i] > heights[i + 1]', 'is_sorted'],
    run(d, R) {
      const { st } = R; R.push(1, N.list('heights', d.length));
      let ok = true, last = 0; R.set('is_sorted', true, 'card'); st.trace.push(['—', '—', '—', '—', 'True']); R.push(2, N.init('is_sorted', 'True', N.flagT));
      for (let k = 0; k < d.length - 1; k++) {
        last = k; st.cls = {}; for (let j = 0; j < k; j++) st.cls[j] = 'done';
        st.cls[k] = 'cur'; st.cls[k + 1] = 'cur'; st.pair = [k, k + 1]; R.set('i', k); R.push(3, N.pair(k, d[k], d[k + 1]) + (k === d.length - 2 ? ' ' + N.lastPair(d.length) : ''));
        const bad = d[k] > d[k + 1]; st.cmp += 1;
        if (bad) {
          R.push(4, N.cmp(`${d[k]} > ${d[k + 1]}`, 'True'));
          ok = false; st.cls[k] = 'bad'; st.cls[k + 1] = 'bad'; R.set('is_sorted', false, 'card'); st.trace.push([k, d[k], d[k + 1], 'True', 'False']); R.push(5, N.upd('is_sorted', 'False'));
          st.pair = null; R.push(6, N.brk); break;
        }
        st.trace.push([k, d[k], d[k + 1], 'False', 'True']); R.push(4, N.cmp(`${d[k]} > ${d[k + 1]}`, 'False'));
      }
      if (ok) { st.cls = {}; d.forEach((_, j) => { st.cls[j] = 'hit'; }); st.pair = null; R.push(3, N.endIdx(d.length - 1)); }
      R.push(7, N.ifres('is_sorted', ok ? 'True' : 'False'));
      if (ok) { R.pr(P().p_sorted); R.push(8, N.print); }
      else { R.push(9, ''); R.pr(`${P().p_unsorted} ${last}`); R.push(10, N.print); }
    },
  },

  /* ---- list operations without functions (tab 1) ---- */
  opset: { op: true, needX: true, needI: true, x: 99, i: 1, def: () => [72, 45, 88, 60], min: 1, max: 9, rnd: () => Array.from({ length: rnd(3, 6) }, () => rnd(10, 99)),
    code: (p, d, o) => [`scores = ${rep(d)}`, `i = ${o.i}`, `x = ${o.x}`, 'scores[i] = x', 'print(scores)'], cols: () => ['i', 'scores[i]', 'scores'],
    run(d, R, o) {
      const { st } = R; const T1 = LANGS[lang].n; const a = d.slice();
      R.push(1, T1.start(rep(a))); R.set('i', o.i); st.cls[o.i] = 'cur'; st.ptr = at(o.i); R.push(2, T1.setI('i', o.i));
      R.set('x', o.x, 'card'); st.trace.push([o.i, a[o.i], rep(a)]); R.push(3, T1.setI('x', o.x));
      const old = a[o.i]; a[o.i] = o.x; st.cards = a.slice(); st.cls[o.i] = 'changed'; st.trace.push([o.i, o.x, rep(a)]); R.push(4, T1.set(o.i, old, o.x));
      st.ptr = null; R.pr(rep(a)); R.push(5, T1.print);
    },
  },
  opadd: { op: true, needX: true, needI: false, x: 60, i: 0, def: () => [72, 45, 88, 60], min: 1, max: 9, rnd: () => Array.from({ length: rnd(3, 6) }, () => rnd(10, 99)),
    code: (p, d, o) => [`scores = ${rep(d)}`, `x = ${o.x}`, 'scores = scores + [x]', 'print(scores)'], cols: () => ['len(scores)', 'scores'],
    run(d, R, o) {
      const { st } = R; const T1 = LANGS[lang].n; const a = d.slice();
      R.push(1, T1.start(rep(a))); R.set('x', o.x, 'card'); st.trace.push([a.length, rep(a)]); R.push(2, T1.setI('x', o.x));
      a.push(o.x); st.cards = a.slice(); st.cls[a.length - 1] = 'enter changed'; st.trace.push([a.length, rep(a)]); R.push(3, T1.add(o.x, a.length));
      st.cls = {}; R.pr(rep(a)); R.push(4, T1.print);
    },
  },
  opins: { op: true, needX: true, needI: true, x: 50, i: 1, def: () => [72, 45, 88, 60], min: 1, max: 9, rnd: () => Array.from({ length: rnd(3, 6) }, () => rnd(10, 99)),
    code: (p, d, o) => [`scores = ${rep(d)}`, `i = ${o.i}`, `x = ${o.x}`, 'scores = scores + [0]', 'for j in range(len(scores) - 1, i, -1):', '    scores[j] = scores[j - 1]', 'scores[i] = x', 'print(scores)'],
    cols: () => ['j', 'scores[j - 1]', 'scores'],
    run(d, R, o) {
      const { st } = R; const T1 = LANGS[lang].n; const a = d.slice();
      R.push(1, T1.start(rep(a))); R.set('i', o.i); R.push(2, T1.setI('i', o.i)); R.set('x', o.x, 'card'); R.push(3, T1.setI('x', o.x));
      a.push(0); st.cards = a.slice(); st.cls = {}; st.cls[a.length - 1] = 'enter changed'; st.trace.push(['—', '—', rep(a)]); R.push(4, T1.grow(a.length));
      st.cls = {};
      for (let j = a.length - 1; j > o.i; j--) {
        st.cls = {}; st.cls[j] = 'cur'; st.cls[j - 1] = 'done'; st.ptr = { idx: j, label: 'j = ' + j }; R.set('j', j); R.push(5, j === a.length - 1 ? T1.rangeDown(a.length - 1, o.i) : `j = ${j}`);
        a[j] = a[j - 1]; st.cards = a.slice(); st.cls[j] = 'changed'; st.trace.push([j, a[j], rep(a)]); R.push(6, T1.shift(j, a[j]));
      }
      st.cls = {}; st.ptr = null; R.push(5, T1.endJ);
      a[o.i] = o.x; st.cards = a.slice(); st.cls[o.i] = 'changed'; st.ptr = at(o.i); st.trace.push(['—', '—', rep(a)]); R.push(7, T1.place(o.i, o.x));
      st.ptr = null; R.pr(rep(a)); R.push(8, T1.print);
    },
  },
  opdel: { op: true, needX: false, needI: true, x: 0, i: 1, def: () => [72, 45, 88, 60], min: 1, max: 9, rnd: () => Array.from({ length: rnd(3, 6) }, () => rnd(10, 99)),
    code: (p, d, o) => [`scores = ${rep(d)}`, `i = ${o.i}`, 'for j in range(i, len(scores) - 1):', '    scores[j] = scores[j + 1]', 'del scores[len(scores) - 1]', 'print(scores)'],
    cols: () => ['j', 'scores[j + 1]', 'scores'],
    run(d, R, o) {
      const { st } = R; const T1 = LANGS[lang].n; const a = d.slice();
      R.push(1, T1.start(rep(a))); R.set('i', o.i); st.cls = {}; st.cls[o.i] = 'bad'; st.ptr = at(o.i); st.trace.push(['—', '—', rep(a)]); R.push(2, T1.delI(o.i, a[o.i]));
      st.ptr = null;
      for (let j = o.i; j < a.length - 1; j++) {
        st.cls = {}; st.cls[j] = 'cur'; st.cls[j + 1] = 'done'; st.ptr = { idx: j, label: 'j = ' + j }; R.set('j', j); R.push(3, j === o.i ? T1.rangeUp(o.i, a.length - 1) : `j = ${j}`);
        a[j] = a[j + 1]; st.cards = a.slice(); st.cls[j] = 'changed'; st.trace.push([j, a[j], rep(a)]); R.push(4, T1.shiftL(j, a[j]));
      }
      st.cls = {}; st.ptr = null; R.push(3, T1.endJ);
      st.cls[a.length - 1] = 'bad'; R.push(5, T1.lastDup(a.length - 1));
      a.pop(); st.cards = a.slice(); st.cls = {}; st.trace.push(['—', '—', rep(a)]); R.push(5, T1.delLast(a.length));
      R.pr(rep(a)); R.push(6, T1.print);
    },
  },
};
function extreme(d, R, op, name, pkey) {
  const { st } = R; R.push(1, N.list('temps', d.length));
  let best = d[0]; R.set(name, best, 'card'); st.trace.push(['—', '—', '—', best]); R.push(2, N.init(name, best, N.firstCard('temps', d[0])));
  let bestIdx = 0;
  d.forEach((v, k) => {
    st.cls[k] = 'cur'; st.ptr = at(k); R.set('i', k); R.push(3, N.takeIdx('temps', k, v));
    const c = op === '>' ? v > best : v < best; st.cmp += 1;
    st.trace.push([k, v, c ? 'True' : 'False', c ? v : best]);
    R.push(4, N.cmp(`temps[${k}] ${op} ${name}  (${v} ${op} ${best})`, c ? 'True' : 'False'));
    if (c) { if (bestIdx !== k) st.cls[bestIdx] = 'done'; best = v; bestIdx = k; R.set(name, best, 'card'); R.push(5, N.upd(name, `temps[${k}] = ${v}`)); st.cls[k] = 'hit'; }
    else st.cls[k] = k === bestIdx ? 'hit' : 'done';
  });
  st.ptr = null; R.push(3, N.endIdx(d.length));
  R.pr(`${P()[pkey]} ${best}`); R.push(6, N.print);
}

function buildFrames(key, data, opt) { const R = recorder(data); APPS[key].run(data, R, opt || {}); return R.frames; }

/* A stepper bound to a container. getKey() -> app key; getData() -> {data, opt} */
function Stepper(root, getKey, getData) {
  const S = { i: -1, frames: [], timer: null, speed: 900 };
  const el = n => $(`[data-s="${n}"]`, root);
  function load() {
    stop(); const key = getKey(); const { data, opt } = getData();
    S.key = key; S.data = data; S.opt = opt; S.frames = buildFrames(key, data, opt); S.i = -1;
    el('code').innerHTML = codeHtml(APPS[key].code(PROG[lang], data, opt));
    el('thead').innerHTML = '<tr>' + APPS[key].cols().map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
    const cmpEl = el('cmp'); if (cmpEl) cmpEl.hidden = !APPS[key].cmp;
    render();
  }
  function cardsHtml(f) {
    const cards = f ? f.cards : (APPS[S.key].startEmpty ? [] : S.data);
    if (!cards.length) return `<div class="empty-hand">[ ]</div>`;
    return cards.map((v, k) => {
      const cls = f && f.cls[k] ? f.cls[k] : '';
      let ptr = '';
      if (f && f.ptr && f.ptr.idx === k) ptr = `<span class="ptr">${esc(f.ptr.label)}</span>`;
      if (f && f.pair && f.pair[0] === k) ptr = `<span class="ptr">i = ${k}</span>`;
      if (f && f.pair && f.pair[1] === k) ptr = `<span class="ptr two">i + 1</span>`;
      return `<div class="slot">${ptr}<div class="card ${cls}" data-v="${v}">${v}</div><span class="idx">${k}</span></div>`;
    }).join('');
  }
  function render() {
    const f = S.frames[S.i];
    $$('.ln', el('code')).forEach(l => l.classList.toggle('on', !!f && Number(l.dataset.l) === f.line));
    el('cards').innerHTML = cardsHtml(f);
    const vars = f ? f.vars : [];
    el('vars').innerHTML = vars.map(v => `<div class="vbox ${f.chg === v.n ? 'chg' : ''}">${v.kind === 'card' ? `<div class="vcard">${esc(rep(v.v))}</div>` : `<div class="vchip">${esc(rep(v.v))}</div>`}<span class="vname">${esc(v.n)}</span></div>`).join('');
    el('narr').textContent = f ? (f.note || ' ') : T.pressNext;
    el('out').innerHTML = f && f.out.length ? esc(f.out.join('\n')) : `<span class="dim">${T.noOutput}</span>`;
    const tr = f ? f.trace : [];
    const prev = S.i > 0 ? S.frames[S.i - 1].trace.length : 0;
    el('tbody').innerHTML = tr.map((r, n) => `<tr class="${n === tr.length - 1 && tr.length > prev ? 'new' : ''}">${r.map((c, j) => `<td class="${n === 0 && j === 0 ? 'first' : ''}">${esc(n === 0 && j === 0 && c === '—' ? T.initialRow : c)}</td>`).join('')}</tr>`).join('');
    el('count').textContent = `${T.step} ${Math.max(0, S.i + 1)}${T.of}${S.frames.length}`;
    const cmpEl = el('cmp'); if (cmpEl) cmpEl.textContent = `${T.compares}: ${f ? f.cmp : 0}`;
    el('prev').disabled = S.i < 0; el('next').disabled = S.i >= S.frames.length - 1;
    el('play').textContent = S.timer ? '❚❚ ' + T.pause : '▷ ' + T.play;
  }

    }
  }
  function answer(right) {

    if (!G.tried) G.first++; G.asked++; G.tried = false; G.ok = true; G.msg = T.g.ok;
    G.vars = Object.assign({}, G.vars, s.vars || {});

    $('#g4CFb').textContent = '';

  $('#g4CChk').onclick = () => {

    $$('#g4Code .blank').forEach(b => { const good = G.blanks[Number(b.dataset.b)].some(a => norm(a) === norm(b.value)); b.className = 'blank ' + (b.value.trim() === '' ? '' : good ? 'ok' : 'no'); if (good) ok++; });

  }
  $('#c5None').onclick = () => { target = 999; draw(); };
  $('#c5Rand').onclick = () => { const s = new Set(); while (s.size < 8) s.add(rnd(100, 499)); codes = [...s]; target = codes[rnd(0, 7)]; draw(); };
  const SETS = [[150, 152, 155, 158, 161, 164, 168], [152, 150, 155, 158, 161, 164, 168], [150, 152, 155, 158, 161, 168, 164]];
  function drawS() {
    const h = SETS[UI.sortSet], n = h.length; let bad = -1;
    for (let i = 0; i < n - 1; i++) if (h[i] > h[i + 1]) { bad = i; break; }
    $('#c5SCards').innerHTML = h.map((v, k) => `<div class="slot"><div class="card ${bad >= 0 && (k === bad || k === bad + 1) ? 'bad' : bad < 0 ? 'hit' : ''}" data-v="${v}">${v}</div><span class="idx">${k}</span></div>`).join('');
    const w = bad >= 0 ? bad + 1 : n - 1;
    $('#c5SBars').innerHTML = `<div class="felt-label">${T.compares}</div>` + bar(T.colFor, n - 1, n - 1, true) + bar(T.colWhile, w, n - 1);
    $('#c5SNote').textContent = T.s4SortNote(n);
  }
  $$('#c5Sets button').forEach(b => b.onclick = () => { $$('#c5Sets button').forEach(x => x.setAttribute('aria-pressed', x === b)); UI.sortSet = Number(b.dataset.v); drawS(); });
  draw(); drawS();
}

/* ===================== boot ===================== */
function selectTab(i) {
  UI.tab = i; try { localStorage.setItem('iter2-tab', String(i)); } catch (e) { /* ignore */ }
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', Number(b.dataset.tab) === i));
  $$('section.tab').forEach((s, k) => { s.hidden = k !== i; });
  if (ST1) ST1.stop(); if (ST3) ST3.stop();
  if (i === 4 || i === 5) pyStart();
}
let fontPx = 16;
function start() {
  T = LANGS[lang]; N = NAR[lang]; AI = APPINFO[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant-HK' : 'en';
  document.title = T.title;
  if (ST1) ST1.stop(); if (ST3) ST3.stop();
  $('#app').innerHTML = shell();
  initTab1(); initTab2(); initTab3(); initTab4(); initTab5(); initTab6();
  selectTab(UI.tab);
  $$('.tabs button').forEach(b => b.onclick = () => selectTab(Number(b.dataset.tab)));
  $('#langBtn').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('iter2-lang', lang); } catch (e) { /* ignore */ } start(); };
  $('#fontDown').onclick = () => { fontPx = Math.max(13, fontPx - 1); document.documentElement.style.fontSize = fontPx + 'px'; };
  $('#fontUp').onclick = () => { fontPx = Math.min(24, fontPx + 1); document.documentElement.style.fontSize = fontPx + 'px'; };
}
start();

</script>
